<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WorstGeneration</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Bebas+Neue&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Orbitron',sans-serif;
  background:#050505;
  color:white;
  overflow-x:hidden;
  cursor:none;
}

/* INTRO */
#intro{
  position:fixed;
  inset:0;
  background:#050505;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  z-index:999999;
  animation:fadeOut 2.5s forwards;
  animation-delay:2s;
}
.intro-logo{
  width:140px;
  border-radius:50%;
  animation:spinZoom 2s;
}
@keyframes spinZoom{
  from{transform:scale(.5) rotate(0);opacity:0;}
  to{transform:scale(1) rotate(360deg);opacity:1;}
}
@keyframes fadeOut{
  to{opacity:0;visibility:hidden;}
}

/* LOADER */
#pageLoader{
  position:fixed;
  inset:0;
  background:#050505;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:99998;
  opacity:0;
  pointer-events:none;
  transition:.4s;
}
#pageLoader.active{opacity:1;pointer-events:auto;}
.loader-logo{
  width:120px;
  border-radius:50%;
  animation:spin 2s linear infinite;
}
@keyframes spin{
  to{transform:rotate(360deg);}
}

/* CURSOR */
#cursor{
  width:18px;
  height:18px;
  border:2px solid red;
  border-radius:50%;
  position:fixed;
  pointer-events:none;
  transform:translate(-50%,-50%);
  z-index:9999999;
  box-shadow:0 0 10px red;
}

/* NAV */
nav{
  position:fixed;
  top:0;
  width:100%;
  display:flex;
  justify-content:center;
  gap:30px;
  padding:15px;
  background:rgba(0,0,0,0.6);
  backdrop-filter:blur(10px);
  z-index:1000;
}
nav a{color:white;text-decoration:none;}
nav a:hover{color:red;}

/* MUSIC BUTTON */
.music-btn{
  position:fixed;
  bottom:20px;
  right:20px;
  padding:12px 15px;
  border:1px solid red;
  background:black;
  color:white;
  cursor:pointer;
  z-index:9999;
}

/* HEADER */
header{
  height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}
.hero-img{
  width:180px;
  border-radius:50%;
  animation:slowSpin 20s linear infinite;
}
@keyframes slowSpin{
  to{transform:rotate(360deg);}
}

h1{
  font-family:'Bebas Neue';
  font-size:5rem;
}

/* ARTISTS */
section{padding:100px 20px;}
.artists{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:25px;
  max-width:1100px;
  margin:auto;
}

.artist{
  background:#0f0f0f;
  padding:20px;
  text-align:center;
  transition:.4s;
  transform-style:preserve-3d;
}
.artist:hover{
  transform:rotateY(10deg) rotateX(10deg) scale(1.05);
  box-shadow:0 0 30px red;
}
.artist img{
  width:100%;
  height:260px;
  object-fit:cover;
}
button{
  margin-top:10px;
  padding:10px;
  border:1px solid red;
  background:none;
  color:white;
  cursor:pointer;
}
button:hover{background:red;}

/* SOCIALS */
.footer{
  text-align:center;
  padding:40px;
}
.footer img{
  width:40px;
  filter:invert(1);
  margin:10px;
}

/* PARTICLES */
#particles{
  position:fixed;
  inset:0;
  z-index:0;
}
</style>
</head>

<body>

<!-- INTRO -->
<div id="intro">
  <img src="https://i.imgur.com/NJlakBe.jpeg" class="intro-logo">

<!-- LOADER -->

</div>

<!-- CURSOR -->

<!-- AUDIO -->

<!-- 🔥 YOUR MUSIC GOES HERE -->

<nav>

<script>
const loader=document.getElementById("pageLoader");
const click=document.getElementById("clickSound");
const music=document.getElementById("bgMusic");

/* MUSIC TOGGLE */
function toggleMusic(){
  if(music.paused){
    music.play();
  }else{
    music.pause();
  }
}

/* PAGE TRANSITION */
function goPage(page){
  click.play();
  loader.classList.add("active");
  setTimeout(()=>{window.location.href=page;},700);
}

/* CURSOR */
const cursor=document.getElementById("cursor");
document.addEventListener("mousemove",e=>{
  cursor.style.left=e.clientX+"px";
  cursor.style.top=e.clientY+"px";
});

/* PARTICLES + MUSIC REACTION */
const canvas=document.getElementById("particles");
const ctx=canvas.getContext("2d");

canvas.width=innerWidth;
canvas.height=innerHeight;

let particles=[];
for(let i=0;i<80;i++){
particles.push({
x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
vx:(Math.random()-0.5)*2,
vy:(Math.random()-0.5)*2
});
}

function animate(){
ctx.clearRect(0,0,canvas.width,canvas.height);

particles.forEach(p=>{
p.x+=p.vx;
p.y+=p.vy;

if(p.x<0||p.x>canvas.width)p.vx*=-1;
if(p.y<0||p.y>canvas.height)p.vy*=-1;

let size = music.paused ? 2 : 4; // reacts to music
ctx.fillStyle="red";
ctx.beginPath();
ctx.arc(p.x,p.y,size,0,Math.PI*2);
ctx.fill();
});

requestAnimationFrame(animate);
}
animate();
</script>

</body>
</html>
